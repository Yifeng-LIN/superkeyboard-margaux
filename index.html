const AC = new (window.AudioContext || window.webkitAudioContext)();
function resumeAC(){ if(AC.state==='suspended') AC.resume(); }

function tone(freq, type, dur, vol=0.3, delay=0){
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type; o.frequency.value=freq;
  const t=AC.currentTime+delay;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur);
}
const sfx={
  key:   ()=>{ tone(500+Math.random()*300,'sine',0.07,0.15); },
  good:  ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.18,0.3,i*0.1)); },
  bad:   ()=>{ tone(180,'sawtooth',0.25,0.25); tone(140,'sawtooth',0.2,0.2,0.18); },
  hit:   ()=>{ tone(220,'square',0.12,0.4); tone(160,'square',0.2,0.35,0.1); },
  lvlup: ()=>{ [523,659,784,1047,1319].forEach((f,i)=>tone(f,'sine',0.22,0.35,i*0.1)); },
  coin:  ()=>{ tone(880,'sine',0.1,0.3); tone(1100,'sine',0.12,0.25,0.08); },
  win:   ()=>{ [523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,'sine',0.25,0.4,i*0.12)); },
};

// Background music
let musicOn=false;
function startMusic(){
  if(musicOn) return; musicOn=true;
  const masterGain=AC.createGain(); masterGain.gain.value=0.07; masterGain.connect(AC.destination);
  const melody=[523,523,659,659,784,784,659,0,587,587,523,523,659,659,523,0];
  const bass  =[131,131,165,165,196,196,165,0,147,147,131,131,165,165,131,0];
  function playBar(start){
    melody.forEach((f,i)=>{ if(f>0) tone(f,'triangle',0.28,1,start+i*0.25); });
    bass.forEach((f,i)=>{ if(f>0) tone(f,'sine',0.5,0.4,start+i*0.25); });
    setTimeout(()=>playBar(AC.currentTime+0.05), melody.length*250-60);
  }
  playBar(AC.currentTime+0.1);
}

// ══════════════════════════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════════════════════════
function spawnParts(x,y,color,n=12,emoji=null){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    gs.particles.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2,
      life:1, dec:0.025+Math.random()*0.025,
      color, size:emoji?22:5+Math.random()*6,
      type:emoji?'emoji':'circle', emoji,
    });
  }
}
function spawnStars(x,y){
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2, sp=3+Math.random()*5;
    gs.particles.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
      life:1, dec:0.018+Math.random()*0.02,
      color:['#FFD700','#FF6B9D','#7EC8E3','#90EE90'][i%4],
      size:6+Math.random()*8, type:'star',
    });
  }
}

// ══════════════════════════════════════════════════════════
//  DRAWING HELPERS
// ══════════════════════════════════════════════════════════
function rrect(x,y,w,h,r,fill,stroke,sw=3){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();}
}

function star5(cx,cy,r,color){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI/2+i*Math.PI*2/5, b=a+Math.PI/5;
    i===0?ctx.moveTo(cx+Math.cos(a)*r,cy-Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy-Math.sin(a)*r);
    ctx.lineTo(cx+Math.cos(b)*(r*.4),cy-Math.sin(b)*(r*.4));
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function emoji(e, x, y, size=44){
  ctx.save();
  ctx.font=`${size}px serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(e, x, y);
  ctx.restore();
}

// ── CHARACTER ─────────────────────────────────────────────
function drawChar(x, y){
  ctx.save();
  const {charState:st, charStateTimer:ti, charFrame:fr} = gs;

  const bounce = (st==='walk'||st==='celebrate') ? Math.sin(fr*0.5)*3 : 0;
  let shakeX=0;
  if(st==='hit') shakeX = Math.sin(ti*1.2)*10*(ti/20);

  ctx.translate(x+shakeX, y+bounce);

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0,42,16,5,0,0,Math.PI*2); ctx.fill();

  // dress
  ctx.fillStyle='#FF6B9D';
  ctx.beginPath(); ctx.roundRect(-13,6,26,24,8); ctx.fill();
  ctx.fillStyle='#FF8FB3';
  ctx.beginPath(); ctx.moveTo(-13,20);ctx.lineTo(-20,42);ctx.lineTo(20,42);ctx.lineTo(13,20);ctx.closePath();ctx.fill();

  // legs
  const lsw = st==='walk'||st==='celebrate' ? Math.sin(fr*.5)*12 : (st==='jump'?-20:0);
  ctx.fillStyle='#FDBCB4';
  [-7,7].forEach((lx,i)=>{
    ctx.save(); ctx.translate(lx,40); ctx.rotate((i===0?-lsw:lsw)*Math.PI/180);
    ctx.fillRect(-4,0,8,13);
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.ellipse(0,13,6,4,0,0,Math.PI); ctx.fill();
    ctx.restore();
  });

  // arms
  const asw = st==='walk' ? Math.sin(fr*.5)*15 : (st==='celebrate'?-40+Math.sin(fr*.3)*20:0);
  ctx.strokeStyle='#FDBCB4'; ctx.lineWidth=8; ctx.lineCap='round';
  [-14,14].forEach((ax,i)=>{
    ctx.save(); ctx.translate(ax,14); ctx.rotate((i===0?asw:-asw)*Math.PI/180);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(i===0?-10:10,16); ctx.stroke();
    ctx.restore();
  });

  // head
  ctx.fillStyle='#FDBCB4'; ctx.beginPath(); ctx.arc(0,-8,17,0,Math.PI*2); ctx.fill();

  // hair
  ctx.fillStyle='#6B3A2A'; ctx.beginPath(); ctx.arc(0,-16,17,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-15,-14,6,10,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15,-14,6,10, 0.5,0,Math.PI*2); ctx.fill();

  // bows
  ['#FFD700','#FF6B9D'].forEach((c,i)=>{
    const bx = i===0?-18:18;
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.ellipse(bx,-24,6,4,-0.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx,-24,6,4, 0.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx,-24,3,0,Math.PI*2); ctx.fill();
  });

  // eyes
  if(st==='hit'){
    ctx.strokeStyle='#333'; ctx.lineWidth=2;
    [[-7,-8],[7,-8]].forEach(([ex,ey])=>{
      ctx.beginPath(); ctx.moveTo(ex-3,ey-3); ctx.lineTo(ex+3,ey+3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex+3,ey-3); ctx.lineTo(ex-3,ey+3); ctx.stroke();
    });
  } else {
    ctx.fillStyle='#2c1654';
    [[-7,-8],[7,-8]].forEach(([ex,ey])=>{ ctx.beginPath(); ctx.arc(ex,ey,4,0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle='#fff';
    [[-5,-10],[9,-10]].forEach(([ex,ey])=>{ ctx.beginPath(); ctx.arc(ex,ey,1.5,0,Math.PI*2); ctx.fill(); });
  }

  // mouth
  ctx.lineWidth=2;
  if(st==='celebrate'){
    ctx.strokeStyle='#c0392b'; ctx.fillStyle='#FF8FB3';
    ctx.beginPath(); ctx.arc(0,-3,7,0.1,Math.PI-.1); ctx.stroke(); ctx.fill();
  } else if(st==='hit'){
    ctx.strokeStyle='#c0392b';
    ctx.beginPath(); ctx.arc(0,0,6,Math.PI+0.3,-0.3); ctx.stroke();
  } else {
    ctx.strokeStyle='#c0392b';
    ctx.beginPath(); ctx.arc(0,-3,5,0.2,Math.PI-.2); ctx.stroke();
  }

  // sparkles during celebrate
  if(st==='celebrate' && ti>0){
    for(let i=0;i<4;i++){
      const a=Date.now()*.005+i*Math.PI*.5;
      const r=30+Math.sin(Date.now()*.01+i)*6;
      star5(Math.cos(a)*r, Math.sin(a)*r-8, 7, ['#FFD700','#FF6B9D','#7EC8E3','#90EE90'][i]);
    }
  }

  ctx.restore();
}

// ── ENEMY ─────────────────────────────────────────────────
function drawEnemy(x){
  ctx.save(); ctx.translate(x, GY-36);
  // body
  ctx.fillStyle='#2ECC71';
  ctx.beginPath(); ctx.arc(0,-10,26,0,Math.PI*2); ctx.fill();
  // bumps on head
  [-14,0,14].forEach(bx=>{
    ctx.beginPath(); ctx.arc(bx,-30,8,0,Math.PI*2); ctx.fill();
  });
  // eyes - angry
  ctx.fillStyle='#fff';
  [[-10,-14],[10,-14]].forEach(([ex,ey])=>{ ctx.beginPath(); ctx.arc(ex,ey,7,0,Math.PI*2); ctx.fill(); });
  ctx.fillStyle='#E74C3C';
  [[-10,-14],[10,-14]].forEach(([ex,ey])=>{ ctx.beginPath(); ctx.arc(ex+2,ey+2,4,0,Math.PI*2); ctx.fill(); });
  // eyebrows angry
  ctx.strokeStyle='#1a5c38'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-17,-22); ctx.lineTo(-3,-18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(17,-22); ctx.lineTo(3,-18); ctx.stroke();
  // mouth (mean grin)
  ctx.strokeStyle='#1a5c38'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,-8,10,0.2,Math.PI-.2); ctx.stroke();
  // teeth
  ctx.fillStyle='#fff';
  [[-6,-8],[-1,-8],[4,-8]].forEach(([tx,ty])=>{
    ctx.fillRect(tx, ty, 4, 5);
  });
  // arms throwing
  ctx.strokeStyle='#27ae60'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(20,-10); ctx.lineTo(36,4); ctx.stroke();
  ctx.restore();
}

// ── PROJECTILE ────────────────────────────────────────────
function drawProjectile(x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.rotate(Date.now()*.01);
  star5(0,0,12,'#E74C3C');
  ctx.restore();
}

// ── BACKGROUND ────────────────────────────────────────────
function drawBG(lv){
  const [sky1,sky2] = lv.bg;
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,sky1); grad.addColorStop(0.75,sky2); grad.addColorStop(1,lv.ground);
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // clouds
  ctx.fillStyle='rgba(255,255,255,0.82)';
  gs.clouds.forEach(c=>{
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(c.s,c.s);
    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2); ctx.arc(22,5,16,0,Math.PI*2);
    ctx.arc(-22,5,16,0,Math.PI*2); ctx.arc(10,-12,14,0,Math.PI*2);
    ctx.fill(); ctx.restore();
  });

  // scrolling trees
  ctx.fillStyle=lv.ground;
  for(let i=0;i<8;i++){
    const tx=((i*120 - gs.bgX*0.3)%( W+100)+W+100)%(W+100)-60;
    ctx.fillStyle='#5D4037';
    ctx.fillRect(tx-4, GY-48, 8, 48);
    ctx.fillStyle='#27ae60';
    ctx.beginPath(); ctx.arc(tx, GY-52, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#2ecc71';
    ctx.beginPath(); ctx.arc(tx-6, GY-62, 16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx+6, GY-58, 18, 0, Math.PI*2); ctx.fill();
  }

  // ground stripe
  ctx.fillStyle=lv.ground;
  ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#4CAF50';
  ctx.fillRect(0,GY,W,14);
  ctx.fillStyle='#66BB6A';
  // grass tufts
  for(let i=0;i<18;i++){
    const gx=((i*48-gs.bgX%48)+W+48)%(W+48)-24;
    ctx.beginPath(); ctx.moveTo(gx,GY+14); ctx.lineTo(gx-5,GY+4); ctx.lineTo(gx+2,GY+8); ctx.lineTo(gx+7,GY+2); ctx.lineTo(gx+13,GY+14); ctx.closePath(); ctx.fill();
  }
}

// ── CHALLENGE CARD ────────────────────────────────────────
function drawCard(item){
  const word  = item.w;
  const typed = gs.typed;
  const cx=W/2, cy=55;

  // shadow
  ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=12;
  rrect(cx-160,cy-38,320,76,18,'#1a0a2ecc',null);
  ctx.shadowBlur=0;

  // pulsing border
  const p=0.5+Math.sin(Date.now()*.004)*.5;
  ctx.strokeStyle=`rgba(255,215,0,${p})`; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect(cx-160,cy-38,320,76,18); ctx.stroke();

  // "TYPE:" label
  ctx.fillStyle='#FFD700aa'; ctx.font='bold 11px Comic Sans MS, cursive'; ctx.textAlign='center';
  ctx.fillText('⌨️ TYPE:', cx, cy-20);

  // letters
  const lw=Math.min(38, 280/word.length);
  const startX=cx-(word.length*lw)/2+lw/2;
  for(let i=0;i<word.length;i++){
    const lx=startX+i*lw, ly=cy+16;
    if(i<typed.length){
      rrect(lx-lw/2+2,ly-20,lw-4,28,7,'#2ECC71',null);
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.min(24,lw-4)}px Comic Sans MS, cursive`;
      ctx.textAlign='center'; ctx.fillText(word[i],lx,ly+5);
    } else if(i===typed.length){
      const blink=Math.sin(Date.now()*.01)>0;
      rrect(lx-lw/2+2,ly-20,lw-4,28,7,blink?'#FFD700':'#FFA500',null);
      ctx.fillStyle='#1a0a2e'; ctx.font=`bold ${Math.min(24,lw-4)}px Comic Sans MS, cursive`;
      ctx.textAlign='center'; ctx.fillText(word[i],lx,ly+5);
    } else {
      rrect(lx-lw/2+2,ly-20,lw-4,28,7,'#ffffff1a','#ffffff55');
      ctx.fillStyle='#ffffffaa'; ctx.font=`bold ${Math.min(24,lw-4)}px Comic Sans MS, cursive`;
      ctx.textAlign='center'; ctx.fillText(word[i],lx,ly+5);
    }
  }
}

// ── REVEAL SCREEN ─────────────────────────────────────────
function drawReveal(item, t){
  const prog = Math.min(1, t/15);
  const scale = 0.5 + prog*0.5;

  ctx.save();
  ctx.fillStyle=`rgba(0,0,0,${0.6*prog})`; ctx.fillRect(0,0,W,H);

  ctx.translate(W/2, H/2); ctx.scale(scale,scale);

  rrect(-180,-130,360,260,28,'#1a0a2e',null);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.roundRect(-180,-130,360,260,28); ctx.stroke();

  // big emoji
  ctx.font='90px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(item.e, 0, -30);

  // word
  ctx.fillStyle='#FFD700'; ctx.font='bold 38px Comic Sans MS, cursive';
  ctx.fillText(item.w, 0, 55);

  // label
  ctx.fillStyle='#fff'; ctx.font='22px Comic Sans MS, cursive';
  ctx.fillText(item.l, 0, 100);

  ctx.restore();
}

// ── TITLE ─────────────────────────────────────────────────
function drawTitle(){
  // animated bg
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#2c1654'); grad.addColorStop(1,'#1a0a2e');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // twinkling stars
  for(let i=0;i<50;i++){
    const sx=(i*139+7)%W, sy=(i*97+13)%(H*.55);
    const b=Math.sin(Date.now()*.002+i)*.5+.5;
    ctx.fillStyle=`rgba(255,255,255,${b*.6+.2})`;
    ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
  }

  const t=Date.now()*.002;
  ctx.textAlign='center';

  // rainbow title
  ctx.save(); ctx.translate(W/2,90); ctx.scale(1+Math.sin(t)*.04, 1+Math.sin(t)*.04);
  const tg=ctx.createLinearGradient(-200,0,200,0);
  tg.addColorStop(0,'#FF6B9D'); tg.addColorStop(.33,'#FFD700'); tg.addColorStop(.66,'#7EC8E3'); tg.addColorStop(1,'#2ECC71');
  ctx.fillStyle=tg; ctx.font='bold 54px Comic Sans MS, cursive';
  ctx.shadowColor='rgba(255,215,0,0.6)'; ctx.shadowBlur=20;
  ctx.fillText('⭐ SuperKeyboard ⭐', 0, 0);
  ctx.shadowBlur=0;
  ctx.fillStyle='#FF8FB3'; ctx.font='bold 36px Comic Sans MS, cursive';
  ctx.fillText('Margaux! 🎮', 0, 48);
  ctx.restore();

  // character
  gs.charFrame += 0.15;
  drawChar(W/2, GY-50);

  // floating emojis decoration
  ['🍎','🐱','⭐','🦋','🐶','🌈'].forEach((e,i)=>{
    const ex=80+i*120, ey=180+Math.sin(t+i)*15;
    ctx.font='32px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e,ex,ey);
  });

  ctx.fillStyle='#fff'; ctx.font='18px Comic Sans MS, cursive'; ctx.textAlign='center';
  ctx.fillText('Type letters → collect things → learn words! 🌟', W/2, 320);

  if(Math.floor(Date.now()/600)%2===0){
    ctx.fillStyle='#FFD700'; ctx.font='bold 22px Comic Sans MS, cursive';
    ctx.fillText('Press ENTER to start! 🎹', W/2, 370);
  }
}

// ── LEVEL UP ──────────────────────────────────────────────
function drawLevelUp(nextLv){
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  const t=Date.now()*.003;
  for(let i=0;i<25;i++){
    const cx2=(Math.sin(t+i*.8)*.4+.5)*W, cy2=((Date.now()*.0003*(0.4+i*.03))%1)*H;
    ctx.save(); ctx.translate(cx2,cy2); ctx.rotate(t+i);
    ctx.fillStyle=['#FFD700','#FF6B9D','#7EC8E3','#2ECC71'][i%4];
    ctx.fillRect(-6,-6,12,12); ctx.restore();
  }
  ctx.textAlign='center';
  ctx.fillStyle='#FFD700'; ctx.font='bold 52px Comic Sans MS, cursive';
  ctx.shadowColor='#FF6B9D'; ctx.shadowBlur=25;
  ctx.fillText('🌟 Level Complete! 🌟', W/2, H/2-40);
  ctx.shadowBlur=0;
  if(nextLv){
    ctx.fillStyle='#fff'; ctx.font='24px Comic Sans MS, cursive';
    ctx.fillText(`Next: ${nextLv.name}`, W/2, H/2+20);
  }
  ctx.fillStyle='#FFD700'; ctx.font='20px Comic Sans MS, cursive';
  ctx.fillText(`Score: ${gs.score} ⭐`, W/2, H/2+60);
  if(Math.floor(Date.now()/700)%2===0){
    ctx.fillStyle='#fff'; ctx.font='18px Comic Sans MS, cursive';
    ctx.fillText('Press ENTER to continue!', W/2, H/2+100);
  }
}

// ── GAME OVER ─────────────────────────────────────────────
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#E74C3C'; ctx.font='bold 48px Comic Sans MS, cursive';
  ctx.fillText('💔 Oops! Try again!', W/2, H/2-50);
  ctx.fillStyle='#fff'; ctx.font='24px Comic Sans MS, cursive';
  ctx.fillText(`You collected ${gs.score} stars!`, W/2, H/2+10);
  ctx.fillText('Keep practicing — you can do it! 💪', W/2, H/2+50);
  if(Math.floor(Date.now()/700)%2===0){
    ctx.fillStyle='#FFD700'; ctx.font='20px Comic Sans MS, cursive';
    ctx.fillText('Press ENTER to try again!', W/2, H/2+100);
  }
}

// ── WIN ───────────────────────────────────────────────────
function drawWin(){
  ctx.fillStyle='rgba(10,5,30,0.85)'; ctx.fillRect(0,0,W,H);
  const t=Date.now()*.003;
  for(let i=0;i<30;i++){
    star5((Math.sin(t+i*.7)*.5+.5)*W, (Math.cos(t*.9+i*.5)*.5+.5)*H,
      7+Math.sin(t+i)*4, ['#FFD700','#FF6B9D','#7EC8E3','#2ECC71'][i%4]);
  }
  ctx.textAlign='center';
  ctx.fillStyle='#FFD700'; ctx.font='bold 44px Comic Sans MS, cursive';
  ctx.shadowColor='#fff'; ctx.shadowBlur=30;
  ctx.fillText('🏆 You Win! Amazing! 🏆', W/2, 120);
  ctx.shadowBlur=0;
  gs.charFrame+=.1;
  drawChar(W/2, GY-50);
  ctx.fillStyle='#fff'; ctx.font='24px Comic Sans MS, cursive';
  ctx.fillText(`Total Stars: ${gs.score} ⭐`, W/2, 300);
  ctx.fillStyle='#FFD700'; ctx.font='20px Comic Sans MS, cursive';
  ctx.fillText('You are a SUPER typer! 🌟🌟🌟', W/2, 340);
  if(Math.floor(Date.now()/700)%2===0){
    ctx.fillStyle='#fff'; ctx.font='18px Comic Sans MS, cursive';
    ctx.fillText('Press ENTER to play again!', W/2, 390);
  }
}

// ══════════════════════════════════════════════════════════
//  UPDATE HUD
// ══════════════════════════════════════════════════════════
function updateHUD(){
  document.getElementById('livesHud').textContent='❤️'.repeat(gs.lives)+'🖤'.repeat(Math.max(0,3-gs.lives));
  document.getElementById('scoreHud').textContent=`⭐ ${gs.score}`;
  document.getElementById('levelHud').textContent=`Level ${gs.level+1}: ${curLevel()?.name||''}`;
}

// ══════════════════════════════════════════════════════════
//  GAME LOGIC
// ══════════════════════════════════════════════════════════
function startGame(resumeFromLevel=false){
  if(!resumeFromLevel){
    gs.level=0; gs.itemIdx=0;
    gs.lives=3; gs.score=0;
  }
  gs.typed=''; gs.state='playing';
  gs.charX=150; gs.charY=GY-50; gs.charVY=0; gs.onGround=true;
  gs.charState='walk'; gs.charStateTimer=0; gs.charFrame=0;
  gs.itemX=490; gs.itemBob=0; gs.itemCatchAnim=0;
  gs.enemyX=950; gs.enemyActive=false;
  gs.projActive=false; gs.projX=-999;
  gs.particles=[];
  updateHUD();
  startMusic();
}

function nextItem(){
  gs.itemIdx++;
  const lv=curLevel();
  if(!lv || gs.itemIdx>=lv.items.length){
    // level complete
    gs.level++;
    if(gs.level>=LEVELS.length){
      gs.state='win'; sfx.win(); return;
    }
    gs.state='levelup'; sfx.lvlup();
    gs.itemIdx=0;
  } else {
    gs.typed='';
    gs.itemX=490; gs.itemCatchAnim=0;
    gs.charState='walk'; gs.charStateTimer=0;
  }
}

function handleCorrectWord(){
  const item=curItem();
  if(!item) return;
  sfx.good();
  gs.score += item.w.length * 10;
  // start item flying to char
  gs.itemCatchAnim=1;
  gs.itemCX=gs.itemX; gs.itemCY=gs.itemY+gs.itemBob;
  gs.charState='celebrate'; gs.charStateTimer=60;
  spawnStars(gs.itemX, GY-80);
  spawnParts(gs.itemX, GY-80,'#FFD700',6,item.e);
}

function handleWrongKey(){
  sfx.hit();
  gs.typed='';
  gs.lives--;
  gs.charState='hit'; gs.charStateTimer=30;
  // launch enemy
  gs.enemyX=820; gs.enemyActive=true;
  gs.projX=820; gs.projY=GY-30; gs.projActive=true; gs.projVX=-12;
  spawnParts(gs.charX, gs.charY,'#E74C3C',10);
  if(gs.lives<=0){ sfx.bad(); setTimeout(()=>{gs.state='gameover';},600); }
  updateHUD();
}

// ══════════════════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════════════════
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lastT,50); lastT=ts;
  ctx.clearRect(0,0,W,H);

  if(gs.state==='title')    { drawTitle(); return; }
  if(gs.state==='levelup')  { drawLevelUp(LEVELS[gs.level]); return; }
  if(gs.state==='gameover') { drawGameOver(); return; }
  if(gs.state==='win')      { drawWin(); return; }

  const lv=curLevel();
  const item=curItem();
  if(!lv||!item) return;

  // ── update ──────────────────────────────────────────────
  gs.bgX+=1.2;
  gs.clouds.forEach(c=>{ c.x-=.3; if(c.x<-70)c.x=W+70; });
  gs.frameTick++; if(gs.frameTick>7){ gs.charFrame++; gs.frameTick=0; }
  gs.itemBob = Math.sin(Date.now()*.004)*10;

  // character state timers
  if(gs.charStateTimer>0){
    gs.charStateTimer--;
    if(gs.charStateTimer<=0 && gs.charState!=='celebrate'){
      gs.charState='walk';
    }
  }
  if(gs.charState==='celebrate' && gs.charStateTimer<=0){
    // show reveal, then next item
    gs.state='reveal'; gs.revealTimer=0;
  }

  // item catch animation
  if(gs.itemCatchAnim>0 && gs.itemCatchAnim<=1){
    gs.itemCatchAnim+=0.06;
    const prog=gs.itemCatchAnim;
    gs.itemX = gs.itemCX + (gs.charX - gs.itemCX)*prog;
    gs.itemY = (gs.itemCY + (gs.charY - gs.itemCY)*prog) - Math.sin(prog*Math.PI)*60;
    if(gs.itemCatchAnim>=1){ sfx.coin(); gs.itemCatchAnim=0; }
  } else {
    gs.itemY = GY-80;
  }

  // enemy movement
  if(gs.enemyActive){
    gs.enemyX += 4; // retreat right
    if(gs.enemyX>950) gs.enemyActive=false;
  }

  // projectile
  if(gs.projActive){
    gs.projX+=gs.projVX; gs.projY+=1;
    if(gs.projX < gs.charX+30){
      gs.projActive=false;
    }
    if(gs.projX<-50) gs.projActive=false;
  }

  // particles
  gs.particles=gs.particles.filter(p=>p.life>0);
  gs.particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.15; p.life-=p.dec; });

  // ── draw ────────────────────────────────────────────────
  drawBG(lv);

  // draw particles
  gs.particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    if(p.type==='star')  star5(p.x,p.y,p.size,p.color);
    else if(p.type==='emoji'){ ctx.font=`${p.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.emoji,p.x,p.y); }
    else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  });

  // draw item (floating emoji)
  if(gs.charState!=='celebrate' || gs.itemCatchAnim>0){
    ctx.save();
    // glow ring
    ctx.strokeStyle='rgba(255,215,0,0.5)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(gs.itemX, gs.itemY, 32, 0, Math.PI*2); ctx.stroke();
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(gs.itemX, GY-4, 20, 6, 0, 0, Math.PI*2); ctx.fill();
    // emoji
    emoji(item.e, gs.itemX, gs.itemY+gs.itemBob, 48);
    ctx.restore();
  }

  // character
  drawChar(gs.charX, gs.charY);

  // enemy
  if(gs.enemyActive) drawEnemy(gs.enemyX);

  // projectile
  if(gs.projActive) drawProjectile(gs.projX, gs.projY);

  // challenge card
  drawCard(item);

  // progress dots
  const total=lv.items.length;
  const dSpacing=Math.min(24, 600/total);
  const dotsX=W/2-(total-1)*dSpacing/2;
  for(let i=0;i<total;i++){
    const dx=dotsX+i*dSpacing, dy=H-20;
    if(i<gs.itemIdx){ star5(dx,dy,7,'#FFD700'); }
    else if(i===gs.itemIdx){ ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dx,dy,6,0,Math.PI*2);ctx.stroke(); ctx.fillStyle='#FFD70066';ctx.beginPath();ctx.arc(dx,dy,6,0,Math.PI*2);ctx.fill(); }
    else { ctx.fillStyle='#ffffff33';ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fill(); }
  }

  updateHUD();
}

// reveal state handled separately
function revealLoop(ts){
  requestAnimationFrame(revealLoop2);
}
function revealLoop2(ts){
  // actually handled inline below
}

// Override: patch loop to handle reveal state
const origLoop = loop;
requestAnimationFrame(function patchedLoop(ts){
  requestAnimationFrame(patchedLoop);
  const dt=Math.min(ts-lastT,50); lastT=ts;
  ctx.clearRect(0,0,W,H);

  if(gs.state==='title')    { drawTitle(); return; }
  if(gs.state==='levelup')  { drawLevelUp(LEVELS[gs.level]); return; }
  if(gs.state==='gameover') { drawGameOver(); return; }
  if(gs.state==='win')      { drawWin(); return; }

  if(gs.state==='reveal'){
    const lv=curLevel();
    const item=curItem();
    if(lv) drawBG(lv);
    ctx.clearRect(0,0,W,H);
    if(lv) drawBG(lv);
    if(item) {
      // draw char celebrating in background
      gs.charFrame+=.1;
      drawChar(gs.charX, gs.charY);
      drawReveal(item, gs.revealTimer);
    }
    gs.revealTimer++;
    if(gs.revealTimer>70){
      gs.state='playing';
      nextItem();
      if(gs.state==='playing') { gs.typed=''; gs.itemX=490; gs.itemCatchAnim=0; gs.charState='walk'; gs.charStateTimer=0; }
    }
    updateHUD();
    return;
  }

  // ── playing ─────────────────────────────────────────────
  const lv=curLevel();
  const item=curItem();
  if(!lv||!item) return;

  gs.bgX+=1.2;
  gs.clouds.forEach(c=>{ c.x-=.3; if(c.x<-70)c.x=W+70; });
  gs.frameTick++; if(gs.frameTick>7){ gs.charFrame++; gs.frameTick=0; }
  gs.itemBob = Math.sin(Date.now()*.004)*10;

  if(gs.charStateTimer>0){
    gs.charStateTimer--;
    if(gs.charStateTimer<=0 && gs.charState==='celebrate'){
      gs.state='reveal'; gs.revealTimer=0; return;
    }
    if(gs.charStateTimer<=0) gs.charState='walk';
  }

  if(gs.itemCatchAnim>0){
    gs.itemCatchAnim+=0.07;
    const prog=Math.min(1,gs.itemCatchAnim);
    gs.itemX = gs.itemCX + (gs.charX+20 - gs.itemCX)*prog;
    gs.itemY = gs.itemCY + (gs.charY-20 - gs.itemCY)*prog - Math.sin(prog*Math.PI)*50;
    if(gs.itemCatchAnim>=1){ sfx.coin(); gs.itemCatchAnim=0; gs.itemX=490; }
  }

  if(gs.enemyActive){ gs.enemyX+=5; if(gs.enemyX>960) gs.enemyActive=false; }
  if(gs.projActive){
    gs.projX+=gs.projVX; gs.projY-=.5;
    if(gs.projX<gs.charX+20){ gs.projActive=false; }
    if(gs.projX<-50) gs.projActive=false;
  }

  gs.particles=gs.particles.filter(p=>p.life>0);
  gs.particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.15; p.life-=p.dec; });

  drawBG(lv);

  gs.particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    if(p.type==='star') star5(p.x,p.y,p.size,p.color);
    else if(p.type==='emoji'){ ctx.font=`${p.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.emoji,p.x,p.y); }
    else { ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size/2,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
  });

  // floating item
  if(gs.charState!=='celebrate'){
    ctx.save();
    const ring=0.4+Math.sin(Date.now()*.006)*.3;
    ctx.strokeStyle=`rgba(255,215,0,${ring})`; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(gs.itemX, gs.itemY+gs.itemBob, 34, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(gs.itemX, GY-4, 20, 6, 0, 0, Math.PI*2); ctx.fill();
    emoji(item.e, gs.itemX, gs.itemY+gs.itemBob, 52);
    ctx.restore();
  }

  drawChar(gs.charX, gs.charY);
  if(gs.enemyActive) drawEnemy(gs.enemyX);
  if(gs.projActive)  drawProjectile(gs.projX, gs.projY);

  drawCard(item);

  // progress dots
  const total=lv.items.length;
  const dSp=Math.min(24,600/total);
  const dotsX=W/2-(total-1)*dSp/2;
  for(let i=0;i<total;i++){
    const dx=dotsX+i*dSp, dy=H-18;
    if(i<gs.itemIdx){ star5(dx,dy,7,'#FFD700'); }
    else if(i===gs.itemIdx){ ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dx,dy,6,0,Math.PI*2);ctx.stroke(); ctx.fillStyle='#FFD70066';ctx.beginPath();ctx.arc(dx,dy,6,0,Math.PI*2);ctx.fill(); }
    else { ctx.fillStyle='#ffffff33';ctx.beginPath();ctx.arc(dx,dy,5,0,Math.PI*2);ctx.fill(); }
  }

  updateHUD();
});

// ══════════════════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  resumeAC();

  if(gs.state==='title' && e.key==='Enter'){ startGame(); return; }
  if(gs.state==='levelup' && e.key==='Enter'){
    startGame(true); return;
  }
  if((gs.state==='gameover'||gs.state==='win') && e.key==='Enter'){
    startGame(false); return;
  }
  if(gs.state!=='playing') return;
  if(gs.charState==='hit') return; // can't type while hit

  const ch=e.key.toUpperCase();
  if(ch.length!==1||!/[A-Z]/.test(ch)) return;

  const item=curItem();
  if(!item) return;
  const expected=item.w[gs.typed.length];

  if(ch===expected){
    gs.typed+=ch;
    sfx.key();
    spawnParts(gs.charX+10, gs.charY-30,'#FFD700',4);
    if(gs.typed===item.w){
      handleCorrectWord();
    }
  } else {
    handleWrongKey();
  }
});
